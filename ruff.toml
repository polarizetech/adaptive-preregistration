# The CLI is a single-file script without a .py suffix; lint it explicitly.
line-length = 130
target-version = "py39"
extend-include = ["bin/kit_ap"]

[lint]
select = ["E", "F", "W", "B", "UP"]
ignore = [
  "E401",   # one-line stdlib imports are the house style for these single-file tools
  "UP015",  # explicit open() modes are kept for readability
]
