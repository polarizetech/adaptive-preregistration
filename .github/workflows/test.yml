name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
        exclude:
          - os: ubuntu-latest
            python: "3.9"
        include:
          # ubuntu-latest (26.04) has no Python 3.9 build; 3.9 is still the supported minimum (macOS ships it)
          - os: ubuntu-24.04
            python: "3.9"
    runs-on: ${{ matrix.os }}
    env:
      GIT_CONFIG_GLOBAL: /dev/null  # the tests make throwaway commits; keep runner git config out of them
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -v tests

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
      - name: shellcheck
        run: shellcheck -s bash modules/*/tools/prereg-* modules/*/tools/tag modules/*/githooks/*
      - name: CITATION.cff
        run: pipx run cffconvert --validate
